[package]
name = "event_face_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization & Error handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = "1.16"

# Embedded Database
rusqlite = { version = "0.31", features = ["bundled", "blob"] }

# ONNX Runtime for Inference (with CUDA Graph & Dynamic Load features)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "copy-dylibs", "ndarray", "cuda"] }
ndarray = "0.15"

# Fast SIMD Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fast_image_resize = { version = "4.2", features = ["image"] }
